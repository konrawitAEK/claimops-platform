server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    # Same-origin API: the browser calls /api on this host and nginx forwards it to the backend container,
    # so no CORS setup and no API URL baked into the build.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Hashed build output can be cached forever.
    location ~* "^/[^/]+-[A-Za-z0-9_-]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback so deep links like /claim/track load the app.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
